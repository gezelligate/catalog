name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Structural validation
        run: pnpm validate

      - name: Build compiled lifecycles
        run: pnpm build

      - name: Ensure compiled lifecycles are committed
        run: |
          if ! git diff --quiet providers; then
            echo "::error::compiled provider files are out of date - run 'pnpm build' and commit the result."
            git --no-pager diff providers
            exit 1
          fi

      - name: Ensure committed catalog.json content matches generator output
        run: |
          # The generator stamps volatile ref/generatedAt fields on every run, so
          # a plain `git diff` can never be clean (audit finding 6.8). Compare only
          # the stable content and then restore the committed file so the tree
          # stays clean for later steps.
          cp catalog.json /tmp/catalog.committed.json
          pnpm generate-catalog-json
          committed=$(jq -S 'del(.ref, .generatedAt)' /tmp/catalog.committed.json)
          regenerated=$(jq -S 'del(.ref, .generatedAt)' catalog.json)
          git checkout -- catalog.json
          if [ "$committed" != "$regenerated" ]; then
            echo "::error::catalog.json content is out of date - run 'pnpm generate-catalog-json' and commit the result."
            diff <(echo "$committed") <(echo "$regenerated") || true
            exit 1
          fi
